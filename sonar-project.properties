sonar.organization=asm0dey
sonar.projectKey=asm0dey_join-gate-bot

# Backend (Kotlin) and Mini App (TypeScript; Sonar has no Svelte analyzer). SQL migrations stay out.
sonar.sources=src/main/kotlin,web/src
sonar.tests=src/test/kotlin,web/src
sonar.exclusions=web/src/**/*.test.ts
sonar.test.inclusions=src/test/kotlin/**,web/src/**/*.test.ts

# Coverage: JaCoCo from `mise run backend:build`, lcov from `mise run web:test`
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# The en and ru translation tables are the same shape by design
sonar.cpd.exclusions=src/main/kotlin/joinbot/Texts.kt
