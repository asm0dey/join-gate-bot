[settings]
idiomatic_version_file_enable_tools = ["java"]   # take Java from .sdkmanrc

[tools]
bun = "1.4.2"

[tasks."web:install"]
dir = "web"
run = "bun install --frozen-lockfile"

[tasks."web:test"]
depends = ["web:install"]
dir = "web"
run = "bun test src"

[tasks."web:build"]
depends = ["web:install"]
dir = "web"
run = "bun run build"

[tasks."web:preview"]
description = "Mini App with fake data at http://127.0.0.1:5179, no bot needed"
depends = ["web:install"]
dir = "web"
# the fake API takes the backend's port, which vite proxies /api to
run = "bun dev/mock-api.ts & trap 'kill $!' EXIT; bunx vite --host 127.0.0.1 --port 5179 --strictPort"

[tasks."backend:test"]
run = "./mvnw -B test"

[tasks."backend:build"]
run = "./mvnw -B verify"        # compile, KSP, tests, jar + target/lib

[tasks.test]
depends = ["web:test", "backend:test"]

[tasks.build]
depends = ["web:test", "web:build", "backend:build"]
