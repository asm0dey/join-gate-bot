name: release

# Releases are integers. Tag v1, v2, ... — the tag becomes the image tag.
# The image is the only artifact: the jar alone carries no UI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write   # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - run: mise run test

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # `docker/build-push-action`'s `cache-from`/`cache-to: type=gha` below only persists
      # BuildKit's *layer* cache across runs — the `RUN --mount=type=cache` mounts in
      # Dockerfile (Maven repository, Bun cache) live in BuildKit's separate cache-mount
      # store, which `type=gha` does not touch. buildkit-cache-dance bridges that: it copies
      # each mount's content into a plain directory before the build (so actions/cache below
      # can persist it) and back out after (so the next run's mounts start warm). `cache-dir` +
      # `dockerfile` (rather than a hand-written `cache-map`) auto-discovers every
      # `--mount=type=cache,target=...` in Dockerfile, so a future cache mount added there
      # doesn't also need a matching edit here.
      - name: Cache Docker build mounts
        uses: actions/cache@v6
        id: docker-build-cache
        with:
          path: cache-mount
          key: docker-build-cache-${{ hashFiles('pom.xml', 'web/bun.lock', 'mise.toml') }}
          restore-keys: |
            docker-build-cache-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.docker-build-cache.outputs.cache-hit }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
            ghcr.io/${{ github.repository }}:latest
